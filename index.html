<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MrRobotModZ - En Mantenimiento</title>
  
  <style>
    body {
      margin: 0;
      background-color: #0a0a0a;
      color: #00ff99;
      font-family: 'Courier New', monospace;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .toolbar {
      background-color: #1a1a1a;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #00ff99;
      text-shadow: 0 0 5px #00ff99;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    h1 {
      font-size: 40px;
      text-shadow: 0 0 10px #00ff99;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      color: #ffffff;
      text-shadow: 0 0 5px #00ff99;
      margin-bottom: 30px;
    }

    .loading {
      font-size: 18px;
      color: #00ffff;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .palestina {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    .negro { color: #000000; }
    .blanco { color: #ffffff; }
    .verde { color: #009639; }
    .rojo { color: #ff0000; }
  </style>
</head>
<body>

  <div class="toolbar">MrRobotModZ</div>

  <h1>⚙️ Página en Mantenimiento ⚙️</h1>
  <p>Estamos trabajando para mejorar tu experiencia.<br>Pronto volveremos con más Mods Premium 😎🔥</p>
  <div class="loading">_Cargando...</div>

  <div class="palestina">
    <span class="negro">¡</span>
    <span class="blanco">Alto</span>
    <span class="verde"> al </span>
    <span class="rojo">genocidio en Gaza!</span>
  </div>

</body>
</html>
